apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kairo-demo-tasks
  namespace: kairo-kairo-demo-tasks
  labels:
    app: kairo-demo-tasks
    app.kubernetes.io/managed-by: kairo
spec:
  # Traefik is the only way in. It answers on localhost:80, and the app's
  # public link (a Cloudflare tunnel) points at it with this Host header
  ingressClassName: traefik
  rules:
    - host: kairo-demo-tasks.kairo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kairo-demo-tasks
                port:
                  number: 80
